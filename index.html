<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>happy birthday! <3</title>
    
    <!-- font gugel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* --- homepage sm bg --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #a60000 0%, #ff2424 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* bg bintang */
        #starfield {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* bintang */
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
            animation: twinkle linear infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* --- base nya cuy --- */
        .content-wrapper {
            max-width: 500px;
            width: 88%;
            position: relative;
            z-index: 10;
            color: #ffffff;
            box-sizing: border-box;
        }


        h1 {
            font-family: 'Pinyon Script', cursive;
            font-size: 55px;
            margin-bottom: 10px;
            color: #ffeaa7;
            text-shadow: 0 0 12px rgba(255, 234, 167, 0.6);
            font-weight: normal;
        }



        /* --- login page bos --- */

        #login-screen {
            display: block;
        }

        input[type="password"] {
            padding: 12px;
            width: 80%;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            border-radius: 50px;
            margin-bottom: 15px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            text-align: center;
            box-sizing: border-box;
        }
        
        input[type="password"]::placeholder {
            font-family: 'Poppins', sans-serif;
            font-style: italic;
            color: rgba(255, 255, 255, 0.7);
        }

        input[type="password"]:focus {
            border-color: #ffeaa7;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(255, 234, 167, 0.5);
        }

        .btn-utama {
            padding: 12px 35px;
            background-color: #ffffff;
            color: #a60000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-utama:hover {
            background-color: #ffeaa7;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 234, 167, 0.4);
        }



        /* --- ini dia gongnya --- */

        #main-content {
            display: none;
        }



        /* --- menu 3 elemen phew --- */

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .menu-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .menu-title {
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- bg bintank -->
    <div id="starfield"></div>

    <!-- ====== anjaay jago ====== -->

    <div id="login-screen" class="content-wrapper">
        <div style="font-size: 45px; position: relative; top: -10px; margin-bottom: 5px;">🫶🏻</div>
        <h2 style="font-size: 35px; margin-top: 0; margin-bottom: 8px; color: #ffeaa7; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 234, 167, 0.4);">cieee udah 16 nih si kids</h2>
        <p style="font-size: 15px; position: relative; top: -15px; margin-bottom: 10px; color: #ffeeba">oh no! you have to fill the password..</p>
        <p style="font-size: 12px; opacity: 0.8; color: #ffeaa7; margin-bottom: 10px;">[clue: your fav compliment]</p>
        <input type="password" id="password-input" placeholder="well what's the password?">
        <br>
        <button class="btn-utama" onclick="cekPassword()">ok</button>
        <p id="error-msg" style="color: #ffeaa7; margin-top: 12px; display: none; font-weight: bold; text-shadow: 0 0 8px rgba(0,0,0,0.3);">lupa apa typo?</p>
    </div>


    <!-- ======= gifts ======= -->

    <div id="main-content" class="content-wrapper">
        <h1>selamat bertambah umur!</h1>
        <p style="color: rgba(255, 255, 255, 0.9);">hehe here's kado kecil-kecilan from ur infor girlie</p>

        <div class="menu-grid">
            <a href="NIHHHHTAROSINIWOIII" target="_blank" class="menu-item">
                <div class="menu-icon">♫</div>
                <div class="menu-title">songs</div>
            </a>

            <a href="Eaaaaanih sini" target="_blank" class="menu-item">
                <div class="menu-icon">✉︎</div>
                <div class="menu-title">written by nera</div>
            </a>

            <a href="ihhhhnihtarosini" target="_blank" class="menu-item">
                <div class="menu-icon">▶︎</div>
                <div class="menu-title">some(mories)</div>
            </a>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        function cekPassword() {
            const passwordBenar = "neiraku";
            const inputUser = document.getElementById("password-input").value;
            const errorMsg = document.getElementById("error-msg");

            if (inputUser === passwordBenar) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            } else {
                errorMsg.style.display = "block";
            }
        }

        // BIKIN BINTANG KELAP-KELIP
        const starfield = document.getElementById('starfield');
        const count = 120; // Banyaknya bintang

        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // Ukuran bintang acak (1px - 3.5px)
            const size = Math.random() * 2.5 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            // Sebar posisi acak di layar
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            
            // Durasi kelap-kelip acak
            const duration = Math.random() * 3 + 1.5; // 1.5 detik - 4.5 detik
            const delay = Math.random() * 3;
            star.style.animationDuration = `${duration}s`;
            star.style.animationDelay = `${delay}s`;
            
            starfield.appendChild(star);
        }
    </script>
</body>
</html>
